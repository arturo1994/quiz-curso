<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Making changes to my routine (EN_B1_2011X)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#EDF1F4;
    --panel:#FFFFFF;
    --tinta:#16202B;
    --tinta-suave:#5D6D7C;
    --azul:#2E4EA0;
    --verde:#1B7A50;
    --verde-claro:#E4F1EA;
    --rojo:#A81F2A;
    --rojo-claro:#F8E7E7;
    --linea:#D4DBE2;
    --serif:"Literata",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--fondo);color:var(--tinta);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .envoltura{max-width:42rem;margin:0 auto;padding:3rem 1.25rem 5rem}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  a{color:var(--azul)}
  :focus-visible{outline:2px solid var(--azul);outline-offset:2px}

  .curso-titulo{
    font-family:var(--serif);font-size:clamp(2rem,7vw,2.9rem);font-weight:600;
    line-height:1.1;letter-spacing:-.015em;margin:0 0 .5rem;
  }
  .curso-dato{color:var(--tinta-suave);margin:0 0 2.5rem;font-size:.95rem}

  .lista{list-style:none;margin:0;padding:0;border-top:1px solid var(--linea)}
  .lista li{border-bottom:1px solid var(--linea)}
  .clase{
    width:100%;background:none;border:0;text-align:left;text-decoration:none;color:inherit;
    display:grid;grid-template-columns:2.75rem 1fr auto;align-items:baseline;gap:1rem;
    padding:1.15rem .5rem;transition:background .12s ease;
  }
  .clase:hover{background:var(--panel)}
  .clase-num{font-family:var(--serif);font-size:1.35rem;color:var(--azul)}
  .clase-titulo{font-weight:500}
  .clase-meta{color:var(--tinta-suave);font-size:.875rem;white-space:nowrap}
  .nota{margin-top:2.5rem;color:var(--tinta-suave);font-size:.9rem}

  .barra-sup{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem}
  .barra-sup h2{font-size:.95rem;font-weight:500;margin:0;color:var(--tinta-suave)}
  .volver{color:var(--tinta-suave);font-size:.9rem;text-decoration:underline}
  .volver:hover{color:var(--tinta)}

  .tira{display:flex;gap:3px;margin-bottom:.75rem}
  .tira span{flex:1;height:4px;border-radius:2px;background:var(--linea)}
  .tira .bien{background:var(--verde)}
  .tira .mal{background:var(--rojo)}
  .tira .activa{background:var(--azul)}
  .contador{color:var(--tinta-suave);font-size:.85rem;margin:0 0 1.75rem}

  .enunciado{
    font-family:var(--serif);font-size:clamp(1.3rem,4.2vw,1.6rem);
    font-weight:400;line-height:1.35;margin:0 0 1.75rem;
  }
  .opciones{display:flex;flex-direction:column;gap:.6rem}
  .opcion{
    display:grid;grid-template-columns:1.75rem 1fr;gap:.85rem;align-items:start;
    width:100%;text-align:left;padding:.95rem 1.1rem;background:var(--panel);
    border:1px solid var(--linea);border-radius:6px;
    transition:border-color .12s ease,background .12s ease;
  }
  .opcion:hover:not(:disabled){border-color:var(--azul)}
  .opcion:disabled{cursor:default}
  .letra{font-family:var(--serif);color:var(--tinta-suave)}
  .opcion.correcta{border-color:var(--verde);background:var(--verde-claro)}
  .opcion.correcta .letra{color:var(--verde)}
  .opcion.fallada{border-color:var(--rojo);background:var(--rojo-claro)}
  .opcion.fallada .letra{color:var(--rojo)}
  .opcion.apagada{opacity:.5}

  .respuesta{margin-top:1.5rem}
  .veredicto{font-weight:600;margin:0 0 .4rem}
  .veredicto.bien{color:var(--verde)}
  .veredicto.mal{color:var(--rojo)}
  .explicacion{margin:0;color:var(--tinta-suave)}

  .boton{
    margin-top:1.75rem;background:var(--azul);color:#fff;border:0;text-decoration:none;
    display:inline-block;padding:.8rem 1.5rem;border-radius:6px;font-weight:500;
  }
  .boton:hover{background:#25407F;color:#fff}
  .boton.secundario{background:none;color:var(--azul);border:1px solid var(--linea);margin-left:.5rem}
  .boton.secundario:hover{background:var(--panel);border-color:var(--azul)}
  .pista-teclado{color:var(--tinta-suave);font-size:.8rem;margin:1rem 0 0}

  .marcador{font-family:var(--serif);font-size:4rem;line-height:1;margin:0 0 .35rem}
  .marcador small{font-size:1.5rem;color:var(--tinta-suave)}
  .comentario{margin:0 0 2.5rem;color:var(--tinta-suave)}
  .repaso h3{font-size:1rem;font-weight:600;margin:0 0 1rem;padding-bottom:.6rem;border-bottom:1px solid var(--linea)}
  .fallo{margin-bottom:1.75rem}
  .fallo p{margin:0 0 .35rem}
  .fallo .preg{font-family:var(--serif);font-size:1.05rem}
  .fallo .dato{font-size:.9rem;color:var(--tinta-suave)}
  .fallo .dato b{color:var(--verde);font-weight:500}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script>
/* =====================================================================
   LAS PREGUNTAS DE ESTA CLASE.

   Para agregar una, copiá un bloque { ... } y pegalo debajo,
   separado por coma.

   - "correcta" es la POSICIÓN de la respuesta correcta dentro de
     "opciones", contando desde 0: 0 = la primera, 1 = la segunda,
     2 = la tercera, 3 = la cuarta.
   - "explicacion" aparece después de responder.
   - Si necesitás comillas dobles dentro de un texto, escapalas: \"
   ===================================================================== */

const CLASE = {
  titulo: "Making changes to my routine (EN_B1_2011X)",
  siguiente: null,   // acá va el nombre del archivo de la clase siguiente

  preguntas: [
    {
      enunciado: "I usually ___ dinner at eight, but this week I ___ earlier because of my new schedule.",
      opciones: [
        "am having / eat",
        "have / am eating",
        "have / eat",
        "am having / am eating"
      ],
      correcta: 1,
      explicacion: "La rutina de siempre va en present simple (have) y el cambio de esta semana va en present continuous (am eating). Esa es la oposición central de la clase: lo que hacés habitualmente contra lo que estás haciendo en este momento de tu vida."
    },
    {
      enunciado: "Which group of expressions signals a temporary change rather than a fixed habit?",
      opciones: [
        "usually, most days, always",
        "rarely, every now and again, three times a week",
        "currently, these days, at the moment",
        "every day, every night, most nights"
      ],
      correcta: 2,
      explicacion: "Esas tres marcan que algo pasa ahora, durante un período limitado, y por eso arrastran present continuous. Las otras dicen con qué frecuencia pasa algo de manera habitual y van con present simple."
    },
    {
      enunciado: "Where does 'rarely' go in the sentence 'I leave the office before six'?",
      opciones: [
        "I leave rarely the office before six.",
        "Rarely I leave the office before six.",
        "I leave the office rarely before six.",
        "I rarely leave the office before six."
      ],
      correcta: 3,
      explicacion: "Los adverbios de frecuencia van delante del verbo principal. La excepción es el verbo to be, donde van detrás: I am rarely late. En español el adverbio se mueve con mucha libertad, y de ahí sale el error."
    },
    {
      enunciado: "A swimmer tells you: 'I need at least eight hours of sleep.' How do you say this about her?",
      opciones: [
        "She needs at least eight hours of sleep.",
        "She need at least eight hours of sleep.",
        "She is needing at least eight hours of sleep.",
        "She needing at least eight hours of sleep."
      ],
      correcta: 0,
      explicacion: "En present simple la tercera persona del singular lleva -s. Además need es un verbo de estado: no se usa en continuous aunque estés hablando del presente."
    },
    {
      enunciado: "You go to the cinema about once every two months. Which expression fits best?",
      opciones: [
        "every now and again",
        "most days",
        "three times a week",
        "always"
      ],
      correcta: 0,
      explicacion: "Every now and again describe algo ocasional y sin regularidad fija. Most days y three times a week son mucho más frecuentes, y always es constante."
    },
    {
      enunciado: "Someone says: 'He's always leaving his dishes in the sink.' Why the present continuous with 'always'?",
      opciones: [
        "Because it is a plan for next week",
        "Because 'always' can only be used with the continuous",
        "Because it is a temporary change he started this month",
        "Because it stresses that it happens over and over again"
      ],
      correcta: 3,
      explicacion: "Con always el present continuous no marca algo temporal sino algo que se repite todo el tiempo, casi como un rasgo de la persona. Muchas veces lleva un tono de queja, y ahí está la diferencia con He always leaves his dishes in the sink, que es un dato neutro."
    },
    {
      enunciado: "It's important to ___ an effort to call old friends every now and again.",
      opciones: [
        "do",
        "take",
        "make",
        "have"
      ],
      correcta: 2,
      explicacion: "En inglés se dice make an effort. Como en español decimos hacer un esfuerzo, la tentación es traducir con do, pero suena mal. Pasa lo mismo con make a decision y make a mistake."
    },
    {
      enunciado: "It's a good idea to focus ___ changing one habit at a time.",
      opciones: [
        "in",
        "at",
        "to",
        "on"
      ],
      correcta: 3,
      explicacion: "El verbo es focus on. Como en español es enfocarse en, muchos hispanohablantes dicen focus in. La preposición se aprende pegada al verbo, no se traduce."
    },
    {
      enunciado: "Your friend says she is trying out a new evening routine to sleep better. What does this mean?",
      opciones: [
        "She has already found the routine that works for her",
        "She is testing it to see whether it works",
        "She is making a big effort but failing",
        "She has decided to stop going to bed late"
      ],
      correcta: 1,
      explicacion: "To try something out es probar algo para ver qué tal resulta, sin haber decidido todavía. No confundir con to try hard, que es esforzarse."
    },
    {
      enunciado: "A colleague says it is difficult for him to stick to a routine. What is difficult for him?",
      opciones: [
        "Designing a routine in the first place",
        "Explaining his routine to other people",
        "Keeping to the routine over time",
        "Changing his routine when he needs to"
      ],
      correcta: 2,
      explicacion: "To stick to something es mantenerlo, seguirlo sin abandonarlo. El problema no es armar la rutina sino sostenerla."
    },
    {
      enunciado: "What does the expression 'No two days are the same' tell you about someone's job?",
      opciones: [
        "They work exactly the same hours every day",
        "They only work two days a week",
        "They do not enjoy their job",
        "Their days are all different from each other"
      ],
      correcta: 3,
      explicacion: "Es una expresión hecha: literalmente no hay dos días iguales. Describe variedad, no una queja ni un horario concreto."
    },
    {
      enunciado: "Which of these is an example of self-care?",
      opciones: [
        "Going for a walk with a friend after a long day",
        "Staying late at the office to finish a project",
        "Checking your work email before going to sleep",
        "Skipping lunch so you can get more done"
      ],
      correcta: 0,
      explicacion: "Self-care son las cosas que hacés para cuidar tu propio bienestar. Las otras tres son lo contrario: poner el trabajo por delante tuyo."
    },
    {
      enunciado: "A colleague brings you a coffee on a hard morning and you say: 'That made my day!' What are you expressing?",
      opciones: [
        "That you are annoyed and very busy",
        "That your working day is now finished",
        "That the small gesture made you feel really good",
        "That you had planned it that way"
      ],
      correcta: 2,
      explicacion: "(It) made my day se dice cuando algo lindo te alegra el día, aunque sea un detalle mínimo. No tiene nada que ver con terminar la jornada."
    }
  ]
};
</script>
<div class="envoltura" id="app"></div>

<script>
/* ---------------------------------------------------------------
   De acá para abajo es el motor del quiz. No hace falta tocarlo.
   Si querés que las preguntas salgan siempre en el mismo orden,
   cambiá la línea de abajo por: const MEZCLAR = false;
   --------------------------------------------------------------- */
const MEZCLAR = true;

(function () {
  "use strict";

  const app = document.getElementById("app");
  const LETRAS = ["A", "B", "C", "D", "E", "F"];
  let estado = null;

  function barajar(lista) {
    const copia = lista.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function empezar() {
    const base = MEZCLAR ? barajar(CLASE.preguntas) : CLASE.preguntas.slice();
    const preguntas = base.map(p => {
      let opciones = p.opciones.map((texto, i) => ({ texto, correcta: i === p.correcta }));
      if (MEZCLAR) opciones = barajar(opciones);
      return { enunciado: p.enunciado, explicacion: p.explicacion || "", opciones };
    });
    estado = { preguntas, indice: 0, elegida: null, respuestas: [] };
    verPregunta();
  }

  function cabecera() {
    return `<div class="barra-sup">
      <h2>${esc(CLASE.titulo)}</h2>
      <a class="volver" href="index.html">Todas las clases</a>
    </div>`;
  }

  function verPregunta() {
    const { preguntas, indice, elegida } = estado;
    const p = preguntas[indice];
    const respondida = elegida !== null;
    const acerto = respondida && p.opciones[elegida].correcta;
    const ultima = indice === preguntas.length - 1;

    app.innerHTML = `
      ${cabecera()}
      <div class="tira">
        ${preguntas.map((_, i) => {
          let cls = "";
          if (i < estado.respuestas.length) cls = estado.respuestas[i] ? "bien" : "mal";
          else if (i === indice) cls = "activa";
          return `<span class="${cls}"></span>`;
        }).join("")}
      </div>
      <p class="contador">Pregunta ${indice + 1} de ${preguntas.length}</p>

      <p class="enunciado">${esc(p.enunciado)}</p>

      <div class="opciones">
        ${p.opciones.map((o, i) => {
          let cls = "opcion";
          if (respondida) {
            if (o.correcta) cls += " correcta";
            else if (i === elegida) cls += " fallada";
            else cls += " apagada";
          }
          return `<button class="${cls}" data-opcion="${i}" ${respondida ? "disabled" : ""}>
                    <span class="letra">${LETRAS[i]}</span>
                    <span>${esc(o.texto)}</span>
                  </button>`;
        }).join("")}
      </div>

      <div class="respuesta" aria-live="polite">
        ${respondida ? `
          <p class="veredicto ${acerto ? "bien" : "mal"}">${acerto ? "Correcto" : "Incorrecto"}</p>
          ${p.explicacion ? `<p class="explicacion">${esc(p.explicacion)}</p>` : ""}
          <button class="boton" id="siguiente">${ultima ? "Ver resultado" : "Siguiente pregunta"}</button>
        ` : `<p class="pista-teclado">Elegí una opción, o usá las teclas 1 a ${p.opciones.length}.</p>`}
      </div>
    `;

    if (!respondida) {
      app.querySelectorAll("[data-opcion]").forEach(b => {
        b.addEventListener("click", () => responder(Number(b.dataset.opcion)));
      });
    } else {
      const btn = app.querySelector("#siguiente");
      btn.addEventListener("click", avanzar);
      btn.focus();
    }
  }

  function responder(i) {
    if (estado.elegida !== null) return;
    estado.elegida = i;
    estado.respuestas.push(estado.preguntas[estado.indice].opciones[i].correcta);
    verPregunta();
  }

  function avanzar() {
    if (estado.indice === estado.preguntas.length - 1) {
      verResultado();
    } else {
      estado.indice++;
      estado.elegida = null;
      verPregunta();
    }
  }

  function verResultado() {
    const total = estado.preguntas.length;
    const aciertos = estado.respuestas.filter(Boolean).length;
    const pct = aciertos / total;

    let comentario;
    if (pct === 1) comentario = "Todo correcto. Este tema lo tenés.";
    else if (pct >= 0.7) comentario = "Vas bien. Repasá lo que fallaste y volvé a intentarlo en un par de días.";
    else if (pct >= 0.4) comentario = "A medio camino. Conviene volver a la clase antes de repetir el quiz.";
    else comentario = "Este tema todavía no está. Volvé a la clase y repetí el quiz después.";

    const fallos = estado.preguntas
      .map((p, i) => ({ p, ok: estado.respuestas[i] }))
      .filter(x => !x.ok);

    app.innerHTML = `
      ${cabecera()}
      <p class="marcador">${aciertos}<small>/${total}</small></p>
      <p class="comentario">${comentario}</p>

      ${fallos.length ? `
        <div class="repaso">
          <h3>Para repasar</h3>
          ${fallos.map(({ p }) => {
            const c = p.opciones.find(o => o.correcta);
            return `<div class="fallo">
                      <p class="preg">${esc(p.enunciado)}</p>
                      <p class="dato">Respuesta correcta: <b>${esc(c.texto)}</b></p>
                      ${p.explicacion ? `<p class="dato">${esc(p.explicacion)}</p>` : ""}
                    </div>`;
          }).join("")}
        </div>` : ""}

      <button class="boton" id="repetir">Repetir esta clase</button>
      ${CLASE.siguiente
        ? `<a class="boton secundario" href="${CLASE.siguiente}">Siguiente clase</a>`
        : `<a class="boton secundario" href="index.html">Volver a las clases</a>`}
    `;

    app.querySelector("#repetir").addEventListener("click", empezar);
  }

  document.addEventListener("keydown", e => {
    if (!estado) return;
    if (estado.elegida === null) {
      const n = Number(e.key);
      if (n >= 1 && n <= estado.preguntas[estado.indice].opciones.length) {
        e.preventDefault();
        responder(n - 1);
      }
    } else if (e.key === "Enter") {
      e.preventDefault();
      avanzar();
    }
  });

  empezar();
})();
</script>
</body>
</html>
