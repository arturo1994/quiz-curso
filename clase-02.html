<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Using the present simple passive (EN_B1_2012G)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#EDF1F4;
    --panel:#FFFFFF;
    --tinta:#16202B;
    --tinta-suave:#5D6D7C;
    --azul:#2E4EA0;
    --verde:#1B7A50;
    --verde-claro:#E4F1EA;
    --rojo:#A81F2A;
    --rojo-claro:#F8E7E7;
    --linea:#D4DBE2;
    --serif:"Literata",Georgia,"Times New Roman",serif;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--fondo);color:var(--tinta);font-family:var(--sans);
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .envoltura{max-width:42rem;margin:0 auto;padding:3rem 1.25rem 5rem}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  a{color:var(--azul)}
  :focus-visible{outline:2px solid var(--azul);outline-offset:2px}

  .curso-titulo{
    font-family:var(--serif);font-size:clamp(2rem,7vw,2.9rem);font-weight:600;
    line-height:1.1;letter-spacing:-.015em;margin:0 0 .5rem;
  }
  .curso-dato{color:var(--tinta-suave);margin:0 0 2.5rem;font-size:.95rem}

  .lista{list-style:none;margin:0;padding:0;border-top:1px solid var(--linea)}
  .lista li{border-bottom:1px solid var(--linea)}
  .clase{
    width:100%;background:none;border:0;text-align:left;text-decoration:none;color:inherit;
    display:grid;grid-template-columns:2.75rem 1fr auto;align-items:baseline;gap:1rem;
    padding:1.15rem .5rem;transition:background .12s ease;
  }
  .clase:hover{background:var(--panel)}
  .clase-num{font-family:var(--serif);font-size:1.35rem;color:var(--azul)}
  .clase-titulo{font-weight:500}
  .clase-meta{color:var(--tinta-suave);font-size:.875rem;white-space:nowrap}
  .nota{margin-top:2.5rem;color:var(--tinta-suave);font-size:.9rem}

  .barra-sup{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.5rem}
  .barra-sup h2{font-size:.95rem;font-weight:500;margin:0;color:var(--tinta-suave)}
  .volver{color:var(--tinta-suave);font-size:.9rem;text-decoration:underline}
  .volver:hover{color:var(--tinta)}

  .tira{display:flex;gap:3px;margin-bottom:.75rem}
  .tira span{flex:1;height:4px;border-radius:2px;background:var(--linea)}
  .tira .bien{background:var(--verde)}
  .tira .mal{background:var(--rojo)}
  .tira .activa{background:var(--azul)}
  .contador{color:var(--tinta-suave);font-size:.85rem;margin:0 0 1.75rem}

  .enunciado{
    font-family:var(--serif);font-size:clamp(1.3rem,4.2vw,1.6rem);
    font-weight:400;line-height:1.35;margin:0 0 1.75rem;
  }
  .opciones{display:flex;flex-direction:column;gap:.6rem}
  .opcion{
    display:grid;grid-template-columns:1.75rem 1fr;gap:.85rem;align-items:start;
    width:100%;text-align:left;padding:.95rem 1.1rem;background:var(--panel);
    border:1px solid var(--linea);border-radius:6px;
    transition:border-color .12s ease,background .12s ease;
  }
  .opcion:hover:not(:disabled){border-color:var(--azul)}
  .opcion:disabled{cursor:default}
  .letra{font-family:var(--serif);color:var(--tinta-suave)}
  .opcion.correcta{border-color:var(--verde);background:var(--verde-claro)}
  .opcion.correcta .letra{color:var(--verde)}
  .opcion.fallada{border-color:var(--rojo);background:var(--rojo-claro)}
  .opcion.fallada .letra{color:var(--rojo)}
  .opcion.apagada{opacity:.5}

  .respuesta{margin-top:1.5rem}
  .veredicto{font-weight:600;margin:0 0 .4rem}
  .veredicto.bien{color:var(--verde)}
  .veredicto.mal{color:var(--rojo)}
  .explicacion{margin:0;color:var(--tinta-suave)}

  .boton{
    margin-top:1.75rem;background:var(--azul);color:#fff;border:0;text-decoration:none;
    display:inline-block;padding:.8rem 1.5rem;border-radius:6px;font-weight:500;
  }
  .boton:hover{background:#25407F;color:#fff}
  .boton.secundario{background:none;color:var(--azul);border:1px solid var(--linea);margin-left:.5rem}
  .boton.secundario:hover{background:var(--panel);border-color:var(--azul)}
  .pista-teclado{color:var(--tinta-suave);font-size:.8rem;margin:1rem 0 0}

  .marcador{font-family:var(--serif);font-size:4rem;line-height:1;margin:0 0 .35rem}
  .marcador small{font-size:1.5rem;color:var(--tinta-suave)}
  .comentario{margin:0 0 2.5rem;color:var(--tinta-suave)}
  .repaso h3{font-size:1rem;font-weight:600;margin:0 0 1rem;padding-bottom:.6rem;border-bottom:1px solid var(--linea)}
  .fallo{margin-bottom:1.75rem}
  .fallo p{margin:0 0 .35rem}
  .fallo .preg{font-family:var(--serif);font-size:1.05rem}
  .fallo .dato{font-size:.9rem;color:var(--tinta-suave)}
  .fallo .dato b{color:var(--verde);font-weight:500}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script>
/* =====================================================================
   LAS PREGUNTAS DE ESTA CLASE.

   Para agregar una, copiá un bloque { ... } y pegalo debajo,
   separado por coma.

   - "correcta" es la POSICIÓN de la respuesta correcta dentro de
     "opciones", contando desde 0: 0 = la primera, 1 = la segunda,
     2 = la tercera, 3 = la cuarta.
   - "explicacion" aparece después de responder.
   - Si necesitás comillas dobles dentro de un texto, escapalas: \"
   ===================================================================== */

const CLASE = {
  titulo: "Using the present simple passive (EN_B1_2012G)",
  siguiente: null,   // acá va el nombre del archivo de la clase siguiente

  preguntas: [
    {
      enunciado: "In this region, coffee ___ with hot milk.",
      opciones: [
        "is serve",
        "serves",
        "is served",
        "is serving"
      ],
      correcta: 2,
      explicacion: "El pasivo se arma con el verbo be más el participio pasado: is served. Ojo con is serving, que se parece pero es present continuous activo y significaría que el café está sirviendo algo."
    },
    {
      enunciado: "These cakes ___ in a wood oven.",
      opciones: [
        "are baked",
        "is baked",
        "are baking",
        "bakes"
      ],
      correcta: 0,
      explicacion: "El verbo be concuerda con el sujeto de la frase pasiva. Como cakes es plural, va are. El participio nunca cambia: baked se queda igual en singular y en plural."
    },
    {
      enunciado: "Turn this into the passive: 'People eat rice with almost every meal here.'",
      opciones: [
        "Rice eats with almost every meal here.",
        "Rice is eating with almost every meal here.",
        "Rice are eaten with almost every meal here.",
        "Rice is eaten with almost every meal here."
      ],
      correcta: 3,
      explicacion: "El objeto de la frase activa (rice) pasa a ser el sujeto, y people desaparece porque no aporta nada. Rice es singular, así que va is, y el participio de eat es eaten."
    },
    {
      enunciado: "In my country, this tea ___ hot and without sugar.",
      opciones: [
        "is drank",
        "is drunk",
        "is drinked",
        "drinks"
      ],
      correcta: 1,
      explicacion: "Drink hace drank en pasado simple y drunk en participio. El pasivo pide siempre el participio, no el pasado. Es el error más habitual con los verbos irregulares: is drank suena natural pero está mal."
    },
    {
      enunciado: "A meal ___ complete without a soup.",
      opciones: [
        "doesn't consider",
        "isn't consider",
        "not is considered",
        "isn't considered"
      ],
      correcta: 3,
      explicacion: "En el pasivo la negación va en el auxiliar be: isn't considered. Doesn't consider es activo y cambia el sentido, porque diría que la comida no considera algo."
    },
    {
      enunciado: "Where does a frequency adverb like 'often' or 'usually' go in a passive sentence?",
      opciones: [
        "Between 'be' and the past participle",
        "Before the verb 'be'",
        "At the beginning of the sentence",
        "After the object"
      ],
      correcta: 0,
      explicacion: "Se mete en el medio: are often served, is usually included, is often grated. El adverbio parte el verbo en dos, que es justo lo que en español no hacemos."
    },
    {
      enunciado: "Miso soup is made ___ miso paste and broth, and it is eaten ___ millions of people every day.",
      opciones: [
        "by / with",
        "with / with",
        "with / by",
        "by / by"
      ],
      correcta: 2,
      explicacion: "With introduce el ingrediente o la herramienta; by introduce a quien hace la acción. La sopa se hace con pasta de miso, pero la comen personas. Confundir las dos es un error muy común."
    },
    {
      enunciado: "Which of these sentences is in the passive voice?",
      opciones: [
        "The chef is preparing the sauce.",
        "The tables are cleaned after every service.",
        "The restaurant opens at seven every morning.",
        "My grandmother makes the best empanadas."
      ],
      correcta: 1,
      explicacion: "La trampa está en la primera: lleva is, pero preparing es gerundio, así que es present continuous activo. El pasivo necesita be más participio, como en are cleaned."
    },
    {
      enunciado: "A recipe says 'The dough is left to rest for an hour' instead of 'You leave the dough to rest for an hour'. Why?",
      opciones: [
        "Because the passive sounds more polite",
        "Because recipes are always written in the passive by rule",
        "Because who does it is obvious and unimportant: the focus is the process",
        "Because the sentence has no subject"
      ],
      correcta: 2,
      explicacion: "El pasivo se usa cuando quién hace la acción es obvio, desconocido o irrelevante. En una receta ya se sabe que lo hacés vos, y lo que importa es el proceso. Además la frase pasiva sí tiene sujeto: es the dough."
    },
    {
      enunciado: "Why choose 'Muesli is enjoyed by many people around the world' instead of the active version?",
      opciones: [
        "It puts muesli first and avoids a long subject",
        "The passive is grammatically more correct",
        "The active version would be impossible in English",
        "The passive lets you leave out the verb"
      ],
      correcta: 0,
      explicacion: "El texto habla del muesli, así que conviene arrancar por ahí. Además, many people around the world es un sujeto largo y pesado al principio de la frase; el pasivo lo manda al final."
    },
    {
      enunciado: "Your friend says she prefers savoury food at breakfast. What will she probably choose?",
      opciones: [
        "Pancakes with maple syrup",
        "A chocolate pastry",
        "Fruit with honey",
        "Toast with cheese and tomato"
      ],
      correcta: 3,
      explicacion: "Savoury es todo lo que no es dulce. No lo confundas con salty, que es específicamente con mucha sal: una tortilla es savoury aunque no esté salada."
    },
    {
      enunciado: "Hot chocolate is used as a dip for churros. What does this mean?",
      opciones: [
        "It is drunk before eating the churros",
        "The churros are put into it",
        "It is poured over the churros",
        "It is added to the dough before frying"
      ],
      correcta: 1,
      explicacion: "Un dip es una salsa espesa donde metés el alimento antes de comerlo. Si lo tirás por encima no es un dip, es una salsa servida sobre el plato."
    },
    {
      enunciado: "Someone tells you they have a sweet tooth. What does this tell you about them?",
      opciones: [
        "They have a dental problem",
        "They avoid sugar completely",
        "They love sugary food",
        "They prefer salty snacks"
      ],
      correcta: 2,
      explicacion: "To have a sweet tooth es ser goloso. Es una expresión hecha: nada que ver con los dientes de verdad."
    },
    {
      enunciado: "A colleague says the report is a dog's dinner. What do they mean?",
      opciones: [
        "It is a mess, badly done",
        "It is finished and ready to send",
        "It is far too long",
        "It is surprisingly good"
      ],
      correcta: 0,
      explicacion: "A dog's dinner es un desastre, algo hecho de cualquier manera. Suele ir con make: they made a dog's dinner of it."
    }
  ]
};
</script>
<div class="envoltura" id="app"></div>

<script>
/* ---------------------------------------------------------------
   De acá para abajo es el motor del quiz. No hace falta tocarlo.
   Si querés que las preguntas salgan siempre en el mismo orden,
   cambiá la línea de abajo por: const MEZCLAR = false;
   --------------------------------------------------------------- */
const MEZCLAR = true;

(function () {
  "use strict";

  const app = document.getElementById("app");
  const LETRAS = ["A", "B", "C", "D", "E", "F"];
  let estado = null;

  function barajar(lista) {
    const copia = lista.slice();
    for (let i = copia.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
  }

  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function empezar() {
    const base = MEZCLAR ? barajar(CLASE.preguntas) : CLASE.preguntas.slice();
    const preguntas = base.map(p => {
      let opciones = p.opciones.map((texto, i) => ({ texto, correcta: i === p.correcta }));
      if (MEZCLAR) opciones = barajar(opciones);
      return { enunciado: p.enunciado, explicacion: p.explicacion || "", opciones };
    });
    estado = { preguntas, indice: 0, elegida: null, respuestas: [] };
    verPregunta();
  }

  function cabecera() {
    return `<div class="barra-sup">
      <h2>${esc(CLASE.titulo)}</h2>
      <a class="volver" href="index.html">Todas las clases</a>
    </div>`;
  }

  function verPregunta() {
    const { preguntas, indice, elegida } = estado;
    const p = preguntas[indice];
    const respondida = elegida !== null;
    const acerto = respondida && p.opciones[elegida].correcta;
    const ultima = indice === preguntas.length - 1;

    app.innerHTML = `
      ${cabecera()}
      <div class="tira">
        ${preguntas.map((_, i) => {
          let cls = "";
          if (i < estado.respuestas.length) cls = estado.respuestas[i] ? "bien" : "mal";
          else if (i === indice) cls = "activa";
          return `<span class="${cls}"></span>`;
        }).join("")}
      </div>
      <p class="contador">Pregunta ${indice + 1} de ${preguntas.length}</p>

      <p class="enunciado">${esc(p.enunciado)}</p>

      <div class="opciones">
        ${p.opciones.map((o, i) => {
          let cls = "opcion";
          if (respondida) {
            if (o.correcta) cls += " correcta";
            else if (i === elegida) cls += " fallada";
            else cls += " apagada";
          }
          return `<button class="${cls}" data-opcion="${i}" ${respondida ? "disabled" : ""}>
                    <span class="letra">${LETRAS[i]}</span>
                    <span>${esc(o.texto)}</span>
                  </button>`;
        }).join("")}
      </div>

      <div class="respuesta" aria-live="polite">
        ${respondida ? `
          <p class="veredicto ${acerto ? "bien" : "mal"}">${acerto ? "Correcto" : "Incorrecto"}</p>
          ${p.explicacion ? `<p class="explicacion">${esc(p.explicacion)}</p>` : ""}
          <button class="boton" id="siguiente">${ultima ? "Ver resultado" : "Siguiente pregunta"}</button>
        ` : `<p class="pista-teclado">Elegí una opción, o usá las teclas 1 a ${p.opciones.length}.</p>`}
      </div>
    `;

    if (!respondida) {
      app.querySelectorAll("[data-opcion]").forEach(b => {
        b.addEventListener("click", () => responder(Number(b.dataset.opcion)));
      });
    } else {
      const btn = app.querySelector("#siguiente");
      btn.addEventListener("click", avanzar);
      btn.focus();
    }
  }

  function responder(i) {
    if (estado.elegida !== null) return;
    estado.elegida = i;
    estado.respuestas.push(estado.preguntas[estado.indice].opciones[i].correcta);
    verPregunta();
  }

  function avanzar() {
    if (estado.indice === estado.preguntas.length - 1) {
      verResultado();
    } else {
      estado.indice++;
      estado.elegida = null;
      verPregunta();
    }
  }

  function verResultado() {
    const total = estado.preguntas.length;
    const aciertos = estado.respuestas.filter(Boolean).length;
    const pct = aciertos / total;

    let comentario;
    if (pct === 1) comentario = "Todo correcto. Este tema lo tenés.";
    else if (pct >= 0.7) comentario = "Vas bien. Repasá lo que fallaste y volvé a intentarlo en un par de días.";
    else if (pct >= 0.4) comentario = "A medio camino. Conviene volver a la clase antes de repetir el quiz.";
    else comentario = "Este tema todavía no está. Volvé a la clase y repetí el quiz después.";

    const fallos = estado.preguntas
      .map((p, i) => ({ p, ok: estado.respuestas[i] }))
      .filter(x => !x.ok);

    app.innerHTML = `
      ${cabecera()}
      <p class="marcador">${aciertos}<small>/${total}</small></p>
      <p class="comentario">${comentario}</p>

      ${fallos.length ? `
        <div class="repaso">
          <h3>Para repasar</h3>
          ${fallos.map(({ p }) => {
            const c = p.opciones.find(o => o.correcta);
            return `<div class="fallo">
                      <p class="preg">${esc(p.enunciado)}</p>
                      <p class="dato">Respuesta correcta: <b>${esc(c.texto)}</b></p>
                      ${p.explicacion ? `<p class="dato">${esc(p.explicacion)}</p>` : ""}
                    </div>`;
          }).join("")}
        </div>` : ""}

      <button class="boton" id="repetir">Repetir esta clase</button>
      ${CLASE.siguiente
        ? `<a class="boton secundario" href="${CLASE.siguiente}">Siguiente clase</a>`
        : `<a class="boton secundario" href="index.html">Volver a las clases</a>`}
    `;

    app.querySelector("#repetir").addEventListener("click", empezar);
  }

  document.addEventListener("keydown", e => {
    if (!estado) return;
    if (estado.elegida === null) {
      const n = Number(e.key);
      if (n >= 1 && n <= estado.preguntas[estado.indice].opciones.length) {
        e.preventDefault();
        responder(n - 1);
      }
    } else if (e.key === "Enter") {
      e.preventDefault();
      avanzar();
    }
  });

  empezar();
})();
</script>
</body>
</html>
